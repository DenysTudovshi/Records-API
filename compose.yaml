# Runs the published image. This is the file the one-line quickstart pipes in, so it
# must stand alone: no build context, no repository checkout, no local .NET SDK.
#
#   curl -fsSL https://raw.githubusercontent.com/DenysTudovshi/Records-API/main/compose.yaml | docker compose -f - up
#
# A fixed project name matters here: piped over stdin, Compose would otherwise name the
# project after whatever directory the reviewer happens to be standing in.
name: records-api

services:
  db:
    image: postgres:16-alpine
    environment:
      # Throwaway credentials for a database this file creates, that publishes no host
      # port, and that is reachable only from the api container on this private network.
      # Overridable so nobody is tempted to treat the defaults as a real deployment:
      #   POSTGRES_PASSWORD=... docker compose up
      POSTGRES_DB: ${POSTGRES_DB:-whalebone}
      POSTGRES_USER: ${POSTGRES_USER:-whalebone}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-whalebone}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s
    # Deliberately no published port: nothing outside this network needs Postgres, and
    # 5432 is already taken on plenty of developer machines.
    volumes:
      - db-data:/var/lib/postgresql/data

  api:
    image: ghcr.io/denystudovshi/records-api:latest
    pull_policy: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      Database__ConnectionString: "Host=db;Port=5432;Database=${POSTGRES_DB:-whalebone};Username=${POSTGRES_USER:-whalebone};Password=${POSTGRES_PASSWORD:-whalebone}"
      ASPNETCORE_ENVIRONMENT: Production
    ports:
      - "8080:8080"
      # The scrape endpoint has its own listener so it is not served beside the API. Published
      # here anyway: a reviewer should be able to reach it without extra steps, and on a real
      # deployment this port goes to the monitoring network rather than to the world.
      - "9090:9090"
    restart: unless-stopped

volumes:
  db-data:
